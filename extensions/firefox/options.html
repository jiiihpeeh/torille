<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torille — asetukset</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f7ff;
    --surface: #ffffff;
    --surface-2: #f5f9ff;
    --fg: #0c2340;
    --muted: #5b6b84;
    --accent: #003580;
    --accent-soft: #e4efff;
    --border: #dbe1ea;
    --danger: #b42318;
    --shadow: 0 8px 28px rgba(23, 32, 51, 0.08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #071426;
      --surface: #0d1d33;
      --surface-2: #12263f;
      --fg: #eaf2ff;
      --muted: #9fb2cc;
      --accent: #8ab4ff;
      --accent-soft: #16345a;
      --border: #2a3448;
      --danger: #ff8f86;
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--fg);
    background:
      linear-gradient(180deg, var(--accent-soft), transparent 220px),
      radial-gradient(900px 380px at 85% -10%, rgba(0, 53, 128, 0.10), transparent 70%),
      var(--bg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 2.2rem 1.2rem 4rem;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.4rem;
  }
  header h1 {
    margin: 0; font-size: 1.55rem; letter-spacing: -0.02em; font-weight: 700;
  }
  header h1 small {
    display: block; margin-top: 0.15rem;
    color: var(--muted); font-size: 0.82rem; font-weight: 400;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.35rem 0.7rem; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 0.78rem; font-weight: 600; white-space: nowrap;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.15rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card h2 {
    margin: 0 0 0.25rem; font-size: 1rem; font-weight: 650;
  }
  .card p.lead {
    margin: 0 0 0.9rem; color: var(--muted); font-size: 0.9rem;
  }
  .toggle {
    display: flex; align-items: flex-start; gap: 0.7rem;
    padding: 0.5rem 0; cursor: pointer;
  }
  .toggle + .toggle { border-top: 1px solid var(--border); }
  .toggle input[type=checkbox] {
    width: 1.1rem; height: 1.1rem; margin-top: 0.15rem;
    accent-color: var(--accent); flex: 0 0 auto;
  }
  .toggle span { display: block; }
  .toggle small { display: block; color: var(--muted); font-size: 0.82rem; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    background: var(--surface-2);
    padding: 0.05em 0.3em;
    border-radius: 3px;
  }
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 0.7rem 1.4rem;
    margin-top: 0.4rem;
  }
  .settings-grid.single {
    grid-template-columns: 1fr;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.8rem;
    padding: 0.45rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .row:last-child { border-bottom: 0; }
  .row label { color: var(--fg); }
  .row small { display: block; color: var(--muted); font-size: 0.78rem; }
  select, input[type=number], input[type=text] {
    font: inherit; color: var(--fg);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.42rem 0.55rem;
    min-width: 9rem;
  }
  input[type=color] {
    width: 3.4rem; height: 2.4rem; padding: 0.15rem;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface-2);
    cursor: pointer;
  }
  input[type=text]:focus, select:focus, input[type=number]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  form.add-row {
    display: flex; gap: 0.6rem; margin: 0.9rem 0 1rem;
  }
  form.add-row input[type=text] { flex: 1; min-width: 0; }
  button {
    font: inherit; cursor: pointer; border-radius: 9px;
    border: 1px solid transparent; padding: 0.45rem 0.95rem;
    transition: transform 0.06s ease, background 0.15s ease;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost {
    background: var(--surface-2); color: var(--fg); border-color: var(--border);
  }
  button.danger:hover {
    background: var(--danger); border-color: var(--danger); color: white;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8rem; padding: 0.45rem 0;
    border-top: 1px solid var(--border);
  }
  li span {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.88rem; overflow-wrap: anywhere;
  }
  li button { padding: 0.25rem 0.7rem; font-size: 0.85rem; }
  .empty {
    color: var(--muted); font-style: italic; padding: 0.6rem 0 0.2rem;
  }

  .settings-actions { margin-top: 0.8rem; display: flex; gap: 0.6rem; align-items: center; }
  .status {
    min-height: 1.3em; margin-top: 0.55rem;
    color: #15803d; font-size: 0.84rem;
  }
  .status[data-error="1"] { color: var(--danger); }

  .meta {
    display: flex; flex-wrap: wrap; gap: 0.5rem 1rem;
    align-items: center; justify-content: space-between;
    color: var(--muted); font-size: 0.82rem;
    padding: 0.2rem 0.2rem 0;
  }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  @media (max-width: 560px) {
    .row { grid-template-columns: 1fr; }
    .row > :last-child { justify-self: start; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./options.js"></script>
</body>
</html>
