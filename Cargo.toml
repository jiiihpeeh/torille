[workspace]
members = ["tools", "bindings", "wrapper", "torille-wasm", "torille-wasm-leptos", "demo-server"]
resolver = "2"

[workspace.package]
# Everything except tools/ is dual-licensed. The tools crate overrides this
# with GPL-3.0-or-later; see LICENSE, tools/LICENSE, and tools/README.md.
license = "MIT OR Apache-2.0"

[package]
name = "torille"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# The per-class noun engines in src/expand/nominals/. These are hand-written;
# the rule generator that once dumped class__* modules beside them is gone (see
# 3199fad), and what it left running is these.
default = ["generated-nominals", "generated-verbs"]
generated-nominals = []
# The hand-written per-class verb engines in src/expand/verbs/. On by default
# once the first class is clean against data/kotus_verbit.sqlite: class 52 is
# 0 illegal, and its forms are additive until every class it covers is
# complete enough to supersede the type engine.
generated-verbs = []

[workspace.metadata]
# wasm-pack needs to know which target the index crate was built against;
# setting it here makes wasm-pack's bin lookup work without `--target`.
# (No effect on cargo build.)
index_version = "2"

[dependencies]
# All lookup tables are front-coded binary blobs (`src/expand/static_table.rs`):
# the stem maps, the form subset, and the small `form -> lemma/degree` maps
# (connegatives, adverbs, adjective degrees, negation fusions). No `phf`
# runtime is needed.
#
# The committed `maps/*.bin.gz` are a tooling-only detail: `build.rs`
# decompresses them into `OUT_DIR` and the engine embeds the plain bytes, so
# the runtime and the wasm have no gzip dependency.

[dev-dependencies]
# Criterion is the standard Rust benchmark harness; it tracks per-iteration
# timing with statistical confidence intervals, so the optimisation work in
# `src/suggest.rs` and `src/expand/` has something to compare against.
criterion = { version = "0.5", default-features = false }

# Test-only, for reading the Python-generated parity fixture. Already in
# Cargo.lock through criterion, so this adds no new crate and -- being a
# dev-dependency -- never links into the shipped library or binary. The
# alternative, hand-rolling a JSON reader in the test, is strictly worse.
serde_json = "1"

[[bench]]
name = "torille"
harness = false

[build-dependencies]
# All generated tables are written as binary blobs, so the build script
# needs no phf codegen. `flate2` writes those blobs gzip-compressed at the
# maximum level.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = true
[workspace.lints.rust]
# The engine is safe Rust. Keep it that way: this is a compile-time gate in
# both rustc and clippy, not a convention.
unsafe_code = "deny"

[lints]
workspace = true
