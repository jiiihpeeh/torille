[package]
name = "wrapper"
version = "0.1.0"
edition = "2024"
license.workspace = true

# Staticlib so other C/C++ projects can link directly into their build;
# cdylib so a separately-loaded dynamic library is also possible. cxx-build
# picks one of these depending on how the C++ side is consumed.
[lib]
name = "torille_wrapper"
crate-type = ["staticlib", "cdylib"]

[dependencies]
cxx = "1.0"
torille = { path = ".." }

[build-dependencies]
cxx-build = "1.0"
# The cxx bridge macro expands to `unsafe` trait impls and FFI entry points;
# that is the one crate where unsafe is unavoidable. Every other crate denies
# it, and the engine forbids it at the crate root.
[lints.rust]
unsafe_code = "allow"
